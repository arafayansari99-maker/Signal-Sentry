services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cia
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      BACKGROUND_QUEUE_ENABLED: "true"
      REDIS_QUEUE_NAME: monitoring
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m app.workers.queue_worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cia
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      BACKGROUND_QUEUE_ENABLED: "true"
      REDIS_QUEUE_NAME: monitoring
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
