name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tests each point DATABASE_URL at their own throwaway SQLite file
      # (gitignored *.db), so no seeded database is needed on a fresh checkout.
      - name: Run pytest
        run: python -m pytest -q

  node-tests:
    name: Dashboard JS tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The harness uses only Node stdlib (node:test, vm, fs) — no install step.
      # Note: pass the explicit file path; directory form of node --test is not
      # how this suite is invoked elsewhere (Windows dev shells need the file too).
      - name: Run dashboard JS suite
        run: node --test tests/js/dashboard.xss.test.js
